name: E4
description: Rank ablation against E1; only LoRA rank changes, all other variables stay aligned with E1.
model_id: Qwen/Qwen3-VL-4B-Instruct
quantization: nf4-4bit
lora: {r: 4, alpha: 8, dropout: 0.05, targets: llm}
train_projector: false
lr: 2.0e-4
batch_size: 2
grad_accum: 4
max_steps: 300
seed: 42
ablation: {variable: rank, value: 4, baseline: E1}
